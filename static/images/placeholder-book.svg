<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <!-- Fond dégradé -->
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond -->
  <rect width="300" height="400" fill="url(#bookGradient)"/>
  
  <!-- Livre -->
  <rect x="20" y="30" width="260" height="340" rx="8" fill="#ffffff" opacity="0.1" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Icône livre -->
  <g transform="translate(150, 150)">
    <!-- Pages -->
    <path d="M -40 -50 L -40 50 Q 0 60 40 50 L 40 -50 Z" fill="#ffffff" opacity="0.3"/>
    <path d="M -30 -45 L -30 45 Q 0 52 30 45 L 30 -45 Z" fill="#ffffff" opacity="0.5"/>
    <path d="M -20 -40 L -20 40 Q 0 45 20 40 L 20 -40 Z" fill="#ffffff"/>
    
    <!-- Lignes de texte -->
    <line x1="-15" y1="-20" x2="15" y2="-20" stroke="#667eea" stroke-width="2"/>
    <line x1="-15" y1="-8" x2="15" y2="-8" stroke="#667eea" stroke-width="1.5"/>
    <line x1="-15" y1="4" x2="15" y2="4" stroke="#667eea" stroke-width="1.5"/>
    <line x1="-15" y1="16" x2="15" y2="16" stroke="#667eea" stroke-width="1.5"/>
  </g>
  
  <!-- Texte -->
  <text x="150" y="320" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    📚 Livre
  </text>
  <text x="150" y="355" font-size="14" fill="#ffffff" opacity="0.8" text-anchor="middle">
    Image non disponible
  </text>
</svg>
