services:
  - type: web
    name: bnc-web
    env: python
    buildCommand: "bash build.sh"
    startCommand: "bash start.sh"
    disk:
      name: bnc-data
      mountPath: /var/data/media
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: bnc-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: RENDER_MEDIA_ROOT
        value: /var/data/media
      # Email SMTP - configurer dans le dashboard Render
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Domaine personnalisé (ex: calures-editions.com)
      - key: CUSTOM_DOMAIN
        sync: false

databases:
  - name: bnc-db
    databaseName: bnc
    user: bnc_user
