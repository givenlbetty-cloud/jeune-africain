<div class="footer-newsletter">
    <h6><i class="fas fa-envelope-open-text me-2"></i>Newsletter</h6>
    <p class="footer-newsletter-desc">Recevez nos articles et actualités par e-mail.</p>
    <form method="post" action="{% url 'catalogue:newsletter_subscribe' %}" class="footer-newsletter-form">
        {% csrf_token %}
        <input type="email" name="email" required placeholder="Votre e-mail" class="form-control form-control-sm footer-newsletter-input" aria-label="E-mail newsletter">
        <button type="submit" class="btn btn-sm footer-newsletter-btn">S'abonner</button>
    </form>
</div>
