<!-- OAuth Login Buttons Template -->
<!-- Fichier: templates/auth/oauth_buttons.html -->

{% load socialaccount %}

<div class="oauth-login-container">
    <div class="oauth-divider">
        <span class="divider-text">Ou</span>
    </div>
    
    <!-- Google OAuth Button -->
    <a href="{% provider_login_url 'google' %}" class="btn btn-light oauth-btn oauth-btn-google">
        <svg class="oauth-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>Continuer avec Google</span>
    </a>
    
    <!-- Apple Sign In Button -->
    <a href="{% provider_login_url 'apple' %}" class="btn btn-dark oauth-btn oauth-btn-apple">
        <svg class="oauth-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="white">
            <path d="M17.05 13.5c-.91 0-1.64.5-2.13 1.35.81.75 1.3 1.79 1.3 2.99 0 2.47-1.84 4.25-4.53 4.25-1.82 0-3.39-1.08-4.16-2.53h-.07a.75.75 0 00-.75-.75H6a.75.75 0 00-.75.75v3.17c0 .41.34.75.75.75h.76c.42 0 .75-.34.75-.75v-.75h2.76c.75 1.44 2.31 2.52 4.16 2.52 2.69 0 4.53-1.79 4.53-4.26 0-1.2-.49-2.24-1.3-2.99.49-.85 1.22-1.35 2.13-1.35.97 0 1.62.8 1.62 1.92 0 1.15-.66 1.92-1.62 1.92-.47 0-.91-.18-1.27-.54-.18.09-.36.13-.54.13-.65 0-1.18-.53-1.18-1.18 0-.65.53-1.18 1.18-1.18.19 0 .36.04.54.13.36-.36.8-.54 1.27-.54.96 0 1.62.77 1.62 1.92 0 1.12-.65 1.92-1.62 1.92z"/>
        </svg>
        <span>Continuer avec Apple</span>
    </a>
    
    <!-- Microsoft OAuth Button -->
    <a href="{% provider_login_url 'microsoft' %}" class="btn oauth-btn oauth-btn-microsoft">
        <svg class="oauth-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 23 23" width="20" height="20">
            <rect x="0" y="0" width="11" height="11" fill="#F25022"/>
            <rect x="12" y="0" width="11" height="11" fill="#7FBA00"/>
            <rect x="0" y="12" width="11" height="11" fill="#00A4EF"/>
            <rect x="12" y="12" width="11" height="11" fill="#FFB900"/>
        </svg>
        <span>Continuer avec Microsoft</span>
    </a>
</div>

<!-- CSS Styles pour OAuth Buttons -->
<style>
.oauth-login-container {
    display: none !important;
    gap: 12px;
    margin: 20px 0;
}

.oauth-divider {
    display: flex;
    align-items: center;
    margin: 15px 0;
    font-size: 14px;
    color: #666;
}

.oauth-divider::before,
.oauth-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background-color: #ddd;
}

.divider-text {
    padding: 0 10px;
}

.oauth-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 16px !important;
    border-radius: 8px;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid transparent;
    transition: all 0.3s ease;
    font-size: 15px;
}

.oauth-icon {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Google Button */
.oauth-btn-google {
    background-color: #ffffff;
    color: #3c4043;
    border: 1px solid #dadce0;
}

.oauth-btn-google:hover {
    background-color: #f8f9fa;
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.04), 0 2px 4px rgba(0, 0, 0, 0.04);
}

/* Apple Button */
.oauth-btn-apple {
    background-color: #000000;
    color: #ffffff;
    border: 1px solid #000000;
}

.oauth-btn-apple:hover {
    background-color: #1a1a1a;
    text-decoration: none;
    color: #ffffff;
}

/* Microsoft Button */
.oauth-btn-microsoft {
    background: linear-gradient(135deg, #00A4EF 0%, #0078D4 100%);
    color: #ffffff;
    border: 1px solid #0078D4;
}

.oauth-btn-microsoft:hover {
    background: linear-gradient(135deg, #0078D4 0%, #005A9E 100%);
    text-decoration: none;
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(0, 120, 212, 0.3);
}

/* Responsive */
@media (max-width: 480px) {
    .oauth-btn {
        font-size: 13px;
        padding: 10px 12px !important;
    }
    
    .oauth-btn span {
        display: none;
    }
    
    .oauth-btn::before {
        content: attr(data-label);
        display: block;
    }
}
</style>

{% comment %}
<!-- Documentation d'utilisation -->
<!--
Pour utiliser cette template dans vos pages de connexion:

1. Dans base.html ou votre template de connexion, incluez:
    {x% include 'auth/oauth_buttons.html' %x} (remove x)

2. Assurez-vous que:
    - django-allauth est installé
    - Les providers (google, apple, microsoft) sont dans INSTALLED_APPS
    - Les variables d'environnement OAuth sont configurées
    - {x% load socialaccount %x} est en haut du template

Flux de connexion:
1. Utilisateur clique sur un bouton OAuth
2. Redirigé vers le fournisseur (Google/Apple/Microsoft)
3. Utilisateur autorise l'accès
4. Redirigé vers http://votre-site.com/accounts/{provider}/login/callback/
5. Utilisateur créé/connecté automatiquement
6. Redirigé vers la page d'accueil
-->
{% endcomment %}
