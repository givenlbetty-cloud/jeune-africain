{% extends "allauth/layouts/entrance.html" %}
{% load i18n %}

{% block head_title %}Connexion annulée{% endblock %}

{% block content %}
<div style="text-align: center; margin-bottom: 1rem;">
    <div style="width: 56px; height: 56px; border-radius: 50%; background: #FEF3C7; display: flex; align-items: center; justify-content: center; margin: 0 auto 0.75rem;">
        <i class="fas fa-exclamation-triangle" style="font-size: 1.3rem; color: #D97706;"></i>
    </div>
</div>

<h1>Connexion annulée</h1>
<p>Vous avez annulé la connexion via votre compte tiers. Aucune action n'a été effectuée.</p>

<a href="{% url 'users:login' %}">
    <button type="button" style="width: 100%; padding: 0.7rem; background: linear-gradient(135deg, var(--primary), #2d4a7a); color: white; border: none; border-radius: 10px; font-size: 0.92rem; font-weight: 700; cursor: pointer; margin-top: 0.5rem;">
        <i class="fas fa-arrow-left"></i> Retour à la connexion
    </button>
</a>
{% endblock %}
