<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mode Hors Ligne — Calures Éditions</title>
    <meta name="theme-color" content="#1B2A4A">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; }
        .card { background: white; border-radius: 16px; padding: 2rem; max-width: 440px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center; }
        .icon { font-size: 3rem; margin-bottom: 1rem; }
        h1 { font-size: 1.3rem; font-weight: 700; color: #1B2A4A; margin-bottom: 0.5rem; }
        .subtitle { font-size: 0.88rem; color: #666; margin-bottom: 1.5rem; line-height: 1.5; }
        .books-section { text-align: left; margin-top: 1rem; }
        .books-section h3 { font-size: 0.85rem; font-weight: 700; color: #1B2A4A; margin-bottom: 0.75rem; }
        .book-item { display: flex; align-items: center; gap: 0.75rem; background: #f8f9fa; border-radius: 10px; padding: 0.75rem; margin-bottom: 0.5rem; cursor: pointer; transition: background 0.2s; text-decoration: none; color: inherit; }
        .book-item:hover { background: #e9ecef; }
        .book-icon { width: 36px; height: 36px; background: #1B2A4A; color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
        .book-info .title { font-size: 0.82rem; font-weight: 600; }
        .book-info .date { font-size: 0.7rem; color: #999; }
        .empty-state { font-size: 0.82rem; color: #999; padding: 1rem; background: #f8f9fa; border-radius: 10px; }
        .status-bar { display: flex; align-items: center; gap: 6px; justify-content: center; margin-top: 1.5rem; font-size: 0.75rem; color: #999; }
        .status-dot { width: 8px; height: 8px; background: #E63946; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .online-redirect { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📴</div>
        <h1>Mode Hors Ligne</h1>
        <p class="subtitle">Vous n'êtes pas connecté à Internet. Vous pouvez lire les livres que vous avez sauvegardés.</p>

        <div class="books-section">
            <h3>📚 Mes livres sauvegardés</h3>
            <div id="booksList">
                <div class="empty-state">Chargement...</div>
            </div>
        </div>

        <div class="status-bar">
            <span class="status-dot"></span>
            <span>En attente de connexion...</span>
        </div>
    </div>

    <script>
    // List saved books from IndexedDB
    (function() {
        var req = indexedDB.open('Calures_Offline', 1);
        req.onupgradeneeded = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains('books')) db.createObjectStore('books', { keyPath: 'id' });
        };
        req.onsuccess = function() {
            var db = req.result;
            if (!db.objectStoreNames.contains('books')) {
                document.getElementById('booksList').innerHTML = '<div class="empty-state">Aucun livre sauvegardé. Connectez-vous et sauvegardez un livre pour le lire hors ligne.</div>';
                return;
            }
            var tx = db.transaction(['books'], 'readonly');
            var store = tx.objectStore('books');
            var all = store.getAll();
            all.onsuccess = function() {
                var books = all.result;
                var container = document.getElementById('booksList');
                if (!books.length) {
                    container.innerHTML = '<div class="empty-state">Aucun livre sauvegardé. Connectez-vous et sauvegardez un livre pour le lire hors ligne.</div>';
                    return;
                }
                var html = '';
                books.forEach(function(b) {
                    var date = b.ts ? new Date(b.ts).toLocaleDateString('fr-FR') : '';
                    var title = b.title || 'Livre';
                    html += '<a href="/offline-reader/' + b.id + '/" class="book-item">';
                    html += '<div class="book-icon">📖</div>';
                    html += '<div class="book-info"><div class="title">' + title + '</div>';
                    html += '<div class="date">Sauvegardé le ' + date + '</div></div>';
                    html += '</a>';
                });
                container.innerHTML = html;
            };
        };
        req.onerror = function() {
            document.getElementById('booksList').innerHTML = '<div class="empty-state">Impossible d\'accéder aux livres sauvegardés.</div>';
        };

        // Auto-redirect when back online
        window.addEventListener('online', function() {
            window.location.href = '/';
        });
        if (navigator.onLine) {
            window.location.href = '/';
        }
    })();
    </script>
</body>
</html>
