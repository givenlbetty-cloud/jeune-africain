<!-- SIMPLE PAYMENT MODAL - Sans dépendances externes -->
<div class="modal fade" id="paymentModal" tabindex="-1" role="dialog" aria-labelledby="paymentModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title" id="paymentModalLabel">
                    💳 Payer pour accéder au livre
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <form id="paymentForm" method="POST" class="needs-validation" novalidate>
                {% csrf_token %}
                <input type="hidden" id="bookId" name="book_id" value="">
                
                <div class="modal-body">
                    <!-- Résumé du livre -->
                    <div class="alert alert-info mb-4">
                        <div class="row">
                            <div class="col-md-8">
                                <h6 class="mb-1" id="bookTitle">Titre du livre</h6>
                                <p class="mb-0 text-muted" id="bookAuthor">Auteur</p>
                            </div>
                            <div class="col-md-4 text-end">
                                <h5 class="mb-0" id="bookPrice">5000 FC</h5>
                                <small class="text-muted">Montant à payer</small>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Sélection méthode de paiement -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">📱 Choisir la méthode de paiement :</label>
                        
                        <div class="row g-3">
                            <!-- Orange Money -->
                            <div class="col-md-6">
                                <div class="form-check payment-option" onclick="selectPaymentMethod('orange')">
                                    <input class="form-check-input" type="radio" name="payment_method" id="method_orange" value="orange" required>
                                    <label class="form-check-label w-100" for="method_orange">
                                        <span style="font-size: 1.5em;">📱</span> Orange Money RDC
                                    </label>
                                </div>
                            </div>
                            
                            <!-- M-Pesa -->
                            <div class="col-md-6">
                                <div class="form-check payment-option" onclick="selectPaymentMethod('mpesa')">
                                    <input class="form-check-input" type="radio" name="payment_method" id="method_mpesa" value="mpesa">
                                    <label class="form-check-label w-100" for="method_mpesa">
                                        <span style="font-size: 1.5em;">📱</span> M-Pesa
                                    </label>
                                </div>
                            </div>
                            
                            <!-- Airtel Money -->
                            <div class="col-md-6">
                                <div class="form-check payment-option" onclick="selectPaymentMethod('airtel')">
                                    <input class="form-check-input" type="radio" name="payment_method" id="method_airtel" value="airtel">
                                    <label class="form-check-label w-100" for="method_airtel">
                                        <span style="font-size: 1.5em;">📱</span> Airtel Money
                                    </label>
                                </div>
                            </div>
                            
                            <!-- Carte Bancaire -->
                            <div class="col-md-6">
                                <div class="form-check payment-option" onclick="selectPaymentMethod('card')">
                                    <input class="form-check-input" type="radio" name="payment_method" id="method_card" value="card">
                                    <label class="form-check-label w-100" for="method_card">
                                        <span style="font-size: 1.5em;">💳</span> Carte Bancaire
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Champ numéro de téléphone (pour mobile money) -->
                    <div id="phoneField" style="display: none;" class="mb-3">
                        <label for="phoneNumber" class="form-label">📞 Numéro de téléphone :</label>
                        <input type="tel" class="form-control" id="phoneNumber" name="phone_number" 
                               placeholder="+243 812 345 678" required>
                        <small class="text-muted">Votre numéro Orange/M-Pesa/Airtel</small>
                    </div>
                    
                    <!-- Conditions d'utilisation -->
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                        <label class="form-check-label" for="agreeTerms">
                            J'accepte les conditions de paiement et la politique de confidentialité
                        </label>
                        <div class="invalid-feedback">Veuillez accepter les conditions</div>
                    </div>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-primary btn-lg" id="paymentBtn">
                        <i class="fas fa-lock"></i> Payer maintenant
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .payment-option {
        border: 2px solid #e9ecef;
        border-radius: 8px;
        padding: 15px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: block;
    }
    
    .payment-option:hover {
        border-color: #0d6efd;
        background-color: #f0f6ff;
    }
    
    .payment-option input[type="radio"]:checked + label {
        color: #0d6efd;
        font-weight: 600;
    }
    
    .payment-option input[type="radio"]:checked {
        border-color: #0d6efd !important;
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const paymentForm = document.getElementById('paymentForm');
    const phoneField = document.getElementById('phoneField');
    const paymentMethods = document.querySelectorAll('input[name="payment_method"]');
    
    // Afficher/masquer le champ téléphone
    function selectPaymentMethod(method) {
        setTimeout(() => {
            if (method === 'orange' || method === 'mpesa' || method === 'airtel') {
                phoneField.style.display = 'block';
                document.getElementById('phoneNumber').required = true;
            } else {
                phoneField.style.display = 'none';
                document.getElementById('phoneNumber').required = false;
            }
        }, 100);
    }
    
    // Écouter les changements
    paymentMethods.forEach(method => {
        method.addEventListener('change', function() {
            selectPaymentMethod(this.value);
        });
    });
    
    // Soumettre le formulaire
    paymentForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        if (!paymentForm.checkValidity()) {
            paymentForm.classList.add('was-validated');
            return false;
        }
        
        const bookId = document.getElementById('bookId').value;
        const method = document.querySelector('input[name="payment_method"]:checked').value;
        const phone = document.getElementById('phoneNumber').value || null;
        
        // Soumettre en arrière-plan
        fetch('/api/payments/mobile-money/' + bookId + '/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('[name="csrfmiddlewaretoken"]').value
            },
            body: JSON.stringify({
                provider: method,
                phone_number: phone
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('✅ Paiement initié!\n\nVérifiez votre téléphone pour confirmer.');
                // Rediriger après 2 secondes
                setTimeout(() => {
                    window.location.href = data.confirmation_url || '/catalogue/';
                }, 2000);
            } else {
                alert('❌ Erreur: ' + (data.error || 'Erreur inconnue'));
            }
        })
        .catch(error => {
            console.error('Erreur:', error);
            alert('❌ Erreur de connexion. Veuillez réessayer.');
        });
    });
});

// Fonction pour ouvrir le modal de paiement
function openPaymentModal(bookId, bookTitle, bookAuthor, bookPrice) {
    document.getElementById('bookId').value = bookId;
    document.getElementById('bookTitle').textContent = bookTitle;
    document.getElementById('bookAuthor').textContent = bookAuthor;
    document.getElementById('bookPrice').textContent = bookPrice + ' FC';
    
    // Réinitialiser le formulaire
    document.getElementById('paymentForm').reset();
    document.getElementById('paymentForm').classList.remove('was-validated');
    document.getElementById('phoneField').style.display = 'none';
    
    // Afficher le modal
    const modal = new bootstrap.Modal(document.getElementById('paymentModal'));
    modal.show();
}
</script>
