<!-- PAYMENT MODAL - Sans aucune dépendance -->
<div id="paymentModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:white; border-radius:8px; padding:30px; max-width:500px; width:90%; box-shadow:0 10px 40px rgba(0,0,0,0.3);">
        
        <!-- Header -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h3 style="margin:0; color:#333;">💳 Paiement</h3>
            <button onclick="closePaymentModal()" style="background:none; border:none; font-size:24px; cursor:pointer; color:#999;">✕</button>
        </div>
        
        <!-- Infos du livre -->
        <div style="background:#f0f6ff; padding:15px; border-radius:5px; margin-bottom:20px;">
            <h5 id="bookTitle" style="margin:0 0 5px 0; color:#333;">Titre du livre</h5>
            <p id="bookPrice" style="margin:0; color:#0066cc; font-size:18px; font-weight:bold;">Prix</p>
        </div>
        
        <!-- Sélection méthode -->
        <label style="display:block; font-weight:bold; margin-bottom:10px;">Méthode de paiement :</label>
        <select id="paymentMethod" onchange="showPhoneField()" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:5px; margin-bottom:15px; font-size:14px;">
            <option value="">-- Sélectionnez --</option>
            <option value="airtel">📱 Airtel Money</option>
            <option value="orange">📱 Orange Money RDC</option>
            <option value="mpesa">📱 Vodacom M-Pesa</option>
            <option value="moov">📱 Moov Money</option>
        </select>
        
        <!-- Champ téléphone -->
        <div id="phoneFieldDiv" style="display:none; margin-bottom:15px;">
            <label style="display:block; font-weight:bold; margin-bottom:5px;">Numéro de téléphone :</label>
            <input type="tel" id="phoneNumber" placeholder="+243 812 345 678" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:5px; font-size:14px; box-sizing:border-box;">
        </div>
        
        <!-- Boutons -->
        <div style="display:flex; gap:10px; justify-content:flex-end;">
            <button onclick="closePaymentModal()" style="padding:10px 20px; background:#ccc; color:#333; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">Annuler</button>
            <button onclick="submitPayment()" style="padding:10px 20px; background:#0066cc; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">💳 Payer</button>
        </div>
    </div>
</div>

<script>
// Variables globales
let currentBookId = '';

// Afficher/masquer le champ téléphone
function showPhoneField() {
    const method = document.getElementById('paymentMethod').value;
    const phoneField = document.getElementById('phoneFieldDiv');
    
    if (method === 'orange' || method === 'mpesa' || method === 'airtel' || method === 'moov') {
        phoneField.style.display = 'block';
    } else {
        phoneField.style.display = 'none';
    }
}

// Ouvrir le modal
function openPaymentModal(bookId, title, author, price) {
    if (!bookId) {
        alert('Erreur: ID du livre manquant');
        return;
    }
    
    currentBookId = bookId;
    document.getElementById('bookTitle').textContent = title;
    document.getElementById('bookPrice').textContent = price + ' FC';
    document.getElementById('paymentMethod').value = '';
    document.getElementById('phoneFieldDiv').style.display = 'none';
    document.getElementById('phoneNumber').value = '';
    
    // Afficher le modal
    const modal = document.getElementById('paymentModal');
    modal.style.display = 'flex';
    
    // Bloquer le scroll
    document.body.style.overflow = 'hidden';
}

// Fermer le modal
function closePaymentModal() {
    const modal = document.getElementById('paymentModal');
    modal.style.display = 'none';
    document.body.style.overflow = 'auto';
}

// Soumettre le paiement
function submitPayment() {
    const method = document.getElementById('paymentMethod').value;
    const phone = document.getElementById('phoneNumber').value || '';
    
    if (!method) {
        alert('❌ Veuillez sélectionner une méthode de paiement');
        return;
    }
    
    if ((method === 'orange' || method === 'mpesa' || method === 'airtel' || method === 'moov') && !phone) {
        alert('❌ Veuillez entrer votre numéro de téléphone');
        return;
    }
    
    // Rediriger vers le flux Mobile Money
    if (method === 'airtel' || method === 'orange' || method === 'mpesa' || method === 'moov') {
        // Mapper les anciennes valeurs aux nouvelles
        const networkMap = {
            'airtel': 'airtel',
            'orange': 'orange',
            'mpesa': 'vodacom',
            'moov': 'moov'
        };
        const network = networkMap[method];
        
        // Rediriger vers le flux Mobile Money avec paramètres
        window.location.href = `/mobilemoney/pay/${currentBookId}/?network=${network}&phone=${encodeURIComponent(phone)}`;
    } else {
        alert('❌ Méthode de paiement non supportée');
    }
    closePaymentModal();
}

// Fonction pour acheter (appelée par le bouton Acheter)
function purchaseBook(bookId, bookTitle, bookAuthor, bookPrice) {
    openPaymentModal(bookId, bookTitle, bookAuthor, bookPrice);
}

// Fermer avec Échap
document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        closePaymentModal();
    }
});

// Fermer en cliquant en dehors du modal
document.getElementById('paymentModal').addEventListener('click', function(event) {
    if (event.target === this) {
        closePaymentModal();
    }
});
</script>
