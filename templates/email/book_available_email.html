<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #28a745; color: white; padding: 20px; border-radius: 8px 8px 0 0; text-align: center; }
        .content { background: #f8f9fa; padding: 20px; border-radius: 0 0 8px 8px; }
        .button { display: inline-block; background: #28a745; color: white; padding: 10px 25px; border-radius: 4px; text-decoration: none; margin: 15px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 {{ book.title }} is Now Available!</h1>
        </div>
        <div class="content">
            <p>Hi {{ user.first_name|default:user.username }},</p>
            <p>Good news! <strong>{{ book.title }}</strong> by {{ book.author }} is now available in our library!</p>
            <p><em>{{ book.description }}</em></p>
            <center><a href="{{ book_url }}" class="button">Read Now</a></center>
            <p>Happy reading!<br>
            The Calures Team</p>
        </div>
    </div>
</body>
</html>
