{% comment %}
Widget affichant les livres tendance par période
{% endcomment %}

<div class="card">
    <div class="card-header bg-gradient" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <h5 class="mb-0 text-white">
            <i class="fas fa-fire"></i> Livres Tendance
        </h5>
    </div>
    
    <div class="card-body">
        <!-- Sélecteur de période -->
        <div class="btn-group mb-3" role="group">
            <input type="radio" class="btn-check" name="trendPeriod" id="period1d" value="1d" checked>
            <label class="btn btn-outline-primary" for="period1d">24h</label>
            
            <input type="radio" class="btn-check" name="trendPeriod" id="period7d" value="7d">
            <label class="btn btn-outline-primary" for="period7d">7 jours</label>
            
            <input type="radio" class="btn-check" name="trendPeriod" id="period30d" value="30d">
            <label class="btn btn-outline-primary" for="period30d">30 jours</label>
            
            <input type="radio" class="btn-check" name="trendPeriod" id="period90d" value="90d">
            <label class="btn btn-outline-primary" for="period90d">90 jours</label>
        </div>
        
        <!-- Liste des tendances -->
        <div id="trendingBooks" class="list-group">
            <div class="text-center text-muted py-4">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p>Chargement...</p>
            </div>
        </div>
    </div>
</div>

<style>
    .trending-item {
        display: flex;
        align-items: center;
        padding: 12px;
        border-bottom: 1px solid #eee;
        transition: background-color 0.2s;
    }
    
    .trending-item:hover {
        background-color: #f8f9fa;
    }
    
    .trending-rank {
        font-size: 24px;
        font-weight: bold;
        min-width: 40px;
        text-align: center;
        margin-right: 15px;
    }
    
    .trending-rank.rank-1 { color: #FFD700; }
    .trending-rank.rank-2 { color: #C0C0C0; }
    .trending-rank.rank-3 { color: #CD7F32; }
    
    .trending-info {
        flex: 1;
    }
    
    .trending-title {
        font-weight: 600;
        color: #333;
        margin-bottom: 5px;
    }
    
    .trending-meta {
        font-size: 12px;
        color: #999;
    }
    
    .trending-score {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 8px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
        white-space: nowrap;
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const periodRadios = document.querySelectorAll('input[name="trendPeriod"]');
    
    // Charger les tendances au démarrage
    loadTrendingBooks('1d');
    
    // Charger au changement de période
    periodRadios.forEach(radio => {
        radio.addEventListener('change', function() {
            loadTrendingBooks(this.value);
        });
    });
    
    function loadTrendingBooks(period) {
        const container = document.getElementById('trendingBooks');
        container.innerHTML = '<div class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';
        
        fetch(`/api/trending/?period=${period}`)
            .then(response => response.json())
            .then(data => {
                if (data.results && data.results.length > 0) {
                    container.innerHTML = data.results.map((item, index) => {
                        const rankEmoji = ['🥇', '🥈', '🥉'][index] || `#${index + 1}`;
                        const rankClass = ['rank-1', 'rank-2', 'rank-3'][index] || '';
                        
                        return `
                            <div class="trending-item">
                                <div class="trending-rank ${rankClass}">
                                    ${rankEmoji}
                                </div>
                                <div class="trending-info">
                                    <div class="trending-title">
                                        <a href="/fr/books/book/${item.book.id}/" style="text-decoration: none; color: inherit;">
                                            ${item.book.title}
                                        </a>
                                    </div>
                                    <div class="trending-meta">
                                        👁️ ${item.reads_count} lectures | ⭐ ${item.ratings_count} évaluations
                                    </div>
                                </div>
                                <div class="trending-score">
                                    ${item.trend_score.toFixed(1)}
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    container.innerHTML = '<div class="text-center text-muted py-4">Aucune tendance pour cette période</div>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                container.innerHTML = '<div class="text-danger text-center py-4">Erreur de chargement</div>';
            });
    }
});
</script>
