<!-- Recommendations Carousel Component -->
<div class="recommendations-container mt-5">
    <!-- Personalized Recommendations -->
    {% if user.is_authenticated %}
    <div class="recommendations-section mb-5">
        <h4 class="mb-4">
            <i class="fas fa-magic"></i> Recommandations Personnalisées
        </h4>
        <div id="personalized-recommendations" class="row g-3">
            <div class="col-12 text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Chargement...</span>
                </div>
            </div>
        </div>
    </div>
    {% endif %}

    <!-- Trending Books -->
    <div class="recommendations-section mb-5">
        <h4 class="mb-4">
            <i class="fas fa-fire text-danger"></i> Tendance cette semaine
        </h4>
        <div id="trending-recommendations" class="row g-3">
            <div class="col-12 text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Chargement...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Best Rated Books -->
    <div class="recommendations-section">
        <h4 class="mb-4">
            <i class="fas fa-star text-warning"></i> Mieux notés
        </h4>
        <div id="best-rated-recommendations" class="row g-3">
            <div class="col-12 text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Chargement...</span>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .recommendations-container {
        background: linear-gradient(135deg, var(--bg-light), var(--bg-white));
        padding: 30px;
        border-radius: 12px;
        margin-top: 40px;
    }

    [data-bs-theme="dark"] .recommendations-container {
        background: linear-gradient(135deg, #1e1e1e, #2d2d2d);
    }

    .recommendations-section {
        padding: 20px 0;
        border-bottom: 1px solid var(--border-color);
    }

    .recommendations-section:last-child {
        border-bottom: none;
    }

    .recommendation-card {
        background: var(--bg-white);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        overflow: hidden;
        transition: all 0.3s ease;
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    [data-bs-theme="dark"] .recommendation-card {
        background: #2d2d2d;
        border-color: #404040;
    }

    .recommendation-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
        border-color: var(--primary-color);
    }

    .recommendation-card-img {
        position: relative;
        height: 200px;
        background: linear-gradient(135deg, #f8f9fa, #f0f0f0);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    [data-bs-theme="dark"] .recommendation-card-img {
        background: linear-gradient(135deg, #1e1e1e, #252525);
    }

    .recommendation-card-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .recommendation-card-img .fa-book {
        font-size: 4rem;
        color: var(--text-secondary);
    }

    .recommendation-reason {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(26, 77, 62, 0.9);
        color: white;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
    }

    .recommendation-trending-badge {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(255, 159, 67, 0.9);
        color: white;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
    }

    .recommendation-card-body {
        padding: 15px;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
    }

    .recommendation-card-title {
        font-weight: 700;
        margin-bottom: 8px;
        line-height: 1.3;
        min-height: 40px;
    }

    .recommendation-card-title a {
        color: var(--text-primary);
        text-decoration: none;
    }

    .recommendation-card-title a:hover {
        color: var(--primary-color);
    }

    .recommendation-card-author {
        color: var(--text-secondary);
        font-size: 0.9rem;
        margin-bottom: 10px;
    }

    .recommendation-card-rating {
        color: #ffc107;
        font-size: 0.9rem;
        margin-bottom: 10px;
    }

    .recommendation-card-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto;
        padding-top: 10px;
        border-top: 1px solid var(--border-color);
        font-size: 0.85rem;
        color: var(--text-secondary);
    }

    .recommendation-card-action {
        margin-top: auto;
        padding-top: 10px;
    }

    .recommendation-card-action a {
        width: 100%;
    }

    .recommendation-score {
        font-size: 0.75rem;
        background: var(--primary-color);
        color: white;
        padding: 2px 8px;
        border-radius: 4px;
    }

    @media (max-width: 768px) {
        .recommendations-container {
            padding: 20px;
        }

        .recommendations-section {
            padding: 15px 0;
        }

        .recommendation-card-img {
            height: 150px;
        }

        .recommendation-card-body {
            padding: 12px;
        }
    }
</style>
