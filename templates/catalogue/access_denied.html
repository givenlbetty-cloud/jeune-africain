{% extends "base.html" %}
{% load i18n %}

{% block title %}Accès refusé — Calures Éditions{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="alert alert-warning" role="alert">
                <i class="fas fa-lock"></i> <strong>Accès refusé</strong>
            </div>
            
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="fas fa-exclamation-triangle fa-5x text-warning mb-3"></i>
                    <h3>Accès limité</h3>
                    <p class="text-muted">{{ message }}</p>
                    <a href="{% url 'catalogue:catalogue' %}" class="btn btn-primary">
                        <i class="fas fa-arrow-left"></i> Retour au catalogue
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
