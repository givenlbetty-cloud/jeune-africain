{% extends "base.html" %}
{% load i18n %}

{% block title %}Éditer réponse — Calures Éditions{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="mb-4">
                <a href="{% url 'catalogue:forum_thread_detail' comment.discussion.id %}" class="text-decoration-none"><i class="fas fa-arrow-left"></i> Retour</a>
            </div>

            <div class="card shadow-sm">
                <div class="card-header bg-light">
                    <h5 class="mb-0">Éditer ma réponse</h5>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <textarea class="form-control" name="content" rows="6" required>{{ comment.content }}</textarea>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'catalogue:forum_thread_detail' comment.discussion.id %}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> Annuler
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Sauvegarder
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
